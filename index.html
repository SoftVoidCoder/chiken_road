<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131c2b">
<title>Crossy Chicken</title>
<!-- 2D-спрайты рисуются на Canvas процедурно: внешних файлов и ассетов нет -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237ec850'/%3E%3Ccircle cx='16' cy='18' r='8' fill='%23fff'/%3E%3Ccircle cx='16' cy='10' r='5' fill='%23fff'/%3E%3Cpath d='M13 6l3-4 3 4z' fill='%23f5a623'/%3E%3Ccircle cx='14' cy='10' r='1.2' fill='%2320242e'/%3E%3Ccircle cx='18' cy='10' r='1.2' fill='%2320242e'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1119;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#0f1725;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
  #hud .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  #hud .pill{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 15px;border-radius:16px;
    background:rgba(11,20,32,.55);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(8px);
    color:#eaf2ff;font-weight:700;line-height:1.15;min-width:66px}
  #hud .pill .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.62;font-weight:600}
  #hud .pill b{font-size:19px;font-variant-numeric:tabular-nums}
  #hud .pill.big{padding:6px 22px}
  #hud .pill.big b{font-size:34px;letter-spacing:-.02em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  #hud .bot{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px;pointer-events:auto}
  .ibtn{width:44px;height:44px;border:1px solid rgba(255,255,255,.16);border-radius:14px;cursor:pointer;
    background:rgba(11,20,32,.55);backdrop-filter:blur(8px);color:#eaf2ff;font-size:17px;line-height:1;
    display:grid;place-items:center;transition:transform .12s,background .2s}
  .ibtn:hover{background:rgba(30,45,66,.7)}
  .ibtn:active{transform:scale(.94)}
  #hintEagle{position:fixed;left:50%;transform:translate(-50%,-14px);top:17%;
    padding:11px 20px;border-radius:14px;background:rgba(200,52,43,.92);color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.28s;z-index:6;pointer-events:none;text-align:center;max-width:90vw}
  #hintEagle.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

  /* ---------- оверлеи ---------- */
  .overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;
    background:radial-gradient(120% 90% at 50% 20%,rgba(19,28,43,.72),rgba(6,10,16,.9));
    backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  .overlay.on{opacity:1;visibility:visible}
  .panel{width:min(400px,92vw);text-align:center;background:linear-gradient(180deg,#fdfcf7,#f2efe6);
    border-radius:26px;padding:26px 24px 22px;box-shadow:0 26px 60px rgba(0,0,0,.5),inset 0 -4px 0 rgba(0,0,0,.07);
    transform:translateY(12px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.25,1.2)}
  .overlay.on .panel{transform:none}
  .panel h1{margin:0;font-size:30px;letter-spacing:-.02em;color:#1d2b3f;line-height:1.1}
  .panel h2{margin:0;font-size:24px;color:#1d2b3f}
  .panel .sub{margin:8px 0 0;font-size:14.5px;color:#5d6b80;line-height:1.5}
  .panel .keys{margin:14px 0 0;font-size:12.5px;color:#7b8798;line-height:1.6}
  .panel .stats{margin:14px 0 0;font-size:13.5px;color:#68758a;font-weight:600}
  .panel .stats b{color:#1d2b3f}
  .panel .reason{margin:8px 0 0;font-size:14.5px;color:#8a3d38;font-weight:600;min-height:20px}
  .panel .big{font-size:56px;font-weight:800;line-height:1.05;margin:6px 0 0;color:#1d2b3f;font-variant-numeric:tabular-nums}
  .rec{display:none;margin-left:6px;padding:3px 9px;border-radius:9px;background:#ffd75e;color:#6b4a00;font-size:12px;font-weight:800}
  .rec.on{display:inline-block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .btn{display:block;width:100%;margin-top:11px;padding:15px 18px;border:0;border-radius:17px;cursor:pointer;
    font:inherit;font-size:16.5px;font-weight:800;letter-spacing:.01em;transition:transform .12s,filter .2s;
    background:#e6e2d6;color:#33415a;box-shadow:0 4px 0 #c9c3b3}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c9c3b3}
  .btn.primary{background:linear-gradient(180deg,#7ed957,#57bb3a);color:#0d3312;box-shadow:0 4px 0 #3f8f2a}
  .btn.primary:active{box-shadow:0 2px 0 #3f8f2a}
  .btn.ad{background:linear-gradient(180deg,#ffd75e,#f0b429);color:#4a3400;box-shadow:0 4px 0 #c08d15;font-size:15px}
  .btn.ad:active{box-shadow:0 2px 0 #c08d15}
  .btn.ghost{background:#e6e2d6;color:#4a5a75}
  .btn[disabled]{filter:grayscale(.35) brightness(.96);cursor:default}
  .logo{width:76px;height:76px;margin:0 auto 6px;border-radius:24px;background:linear-gradient(180deg,#7ed957,#4aa832);
    display:grid;place-items:center;box-shadow:0 8px 0 #3f8f2a,0 14px 26px rgba(0,0,0,.25)}
  .logo svg{width:48px;height:48px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#c9c3b3;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
  @media (max-height:560px){
    .panel{padding:18px;border-radius:20px}
    .panel h1{font-size:23px}.panel .big{font-size:40px}.btn{padding:12px;margin-top:8px;font-size:15px}
    .logo{width:58px;height:58px;margin-bottom:2px}.logo svg{width:36px;height:36px}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="pill"><span class="lbl" id="lblBest">Рекорд</span><b id="vBest">0</b></div>
    <div class="pill big"><b id="vScore">0</b></div>
    <div class="pill"><span class="lbl" id="lblCoins">Монеты</span><b id="vCoins">0</b></div>
  </div>
  <div class="bot">
    <button class="ibtn" id="btnMute" aria-label="Звук">🔊</button>
    <button class="ibtn" id="btnPause" aria-label="Пауза">❚❚</button>
  </div>
</div>

<div id="hintEagle"></div>

<!-- загрузка -->
<div class="overlay on" id="ovLoading">
  <div class="panel">
    <h1>Crossy Chicken</h1>
    <p class="sub" id="ovLoadText">Загрузка…</p>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- меню -->
<div class="overlay" id="ovMenu">
  <div class="panel">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none">
        <ellipse cx="24" cy="30" rx="13" ry="12" fill="#fff"/>
        <ellipse cx="24" cy="16" rx="9" ry="8.5" fill="#fff"/>
        <circle cx="20" cy="15" r="1.6" fill="#20242e"/><circle cx="28" cy="15" r="1.6" fill="#20242e"/>
        <path d="M20 7.5l4-5 4 5z" fill="#f5a623"/>
        <circle cx="18" cy="9" r="2.4" fill="#e8453c"/><circle cx="24" cy="7.6" r="2.6" fill="#e8453c"/><circle cx="29" cy="9.4" r="2.1" fill="#e8453c"/>
        <path d="M18 38l-2 4M30 38l2 4" stroke="#f5a623" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Crossy&nbsp;Chicken</h1>
    <p class="sub" id="tSub">Тап — шаг вперёд, свайп — в сторону</p>
    <button class="btn primary" id="btnPlay">Играть</button>
    <div class="keys" id="tControls">WASD / стрелки — шаг, P — пауза, M — звук</div>
    <div class="keys" id="tControls2" style="margin-top:2px">Тап — вперёд, свайп — в сторону</div>
    <div class="stats"><span id="mLblBest">Рекорд</span>: <b id="mBest">0</b> · <span id="mLblCoins">Монеты</span>: <b id="mCoins">0</b></div>
  </div>
</div>

<!-- конец игры -->
<div class="overlay" id="ovOver">
  <div class="panel">
    <h2 id="tOver">Игра окончена</h2>
    <p class="reason" id="tReason"></p>
    <div class="big" id="oScore">0</div>
    <div class="stats"><span id="oLblBest">Рекорд</span>: <b id="oBest">0</b><span class="rec" id="oRecord">Новый рекорд!</span></div>
    <button class="btn primary" id="btnRestart">Играть снова</button>
    <button class="btn ad" id="btnRevive" hidden>Продолжить за рекламу</button>
  </div>
</div>

<!-- пауза -->
<div class="overlay" id="ovPause">
  <div class="panel">
    <h2 id="tPaused">Пауза</h2>
    <button class="btn primary" id="btnResume">Продолжить</button>
    <button class="btn ghost" id="btnRestart2">Заново</button>
  </div>
</div>

<!-- Yandex Games SDK v2: вне площадки не загрузится — platform.js это переживёт -->
<script src="https://yandex.ru/games/sdk/v2"></script>
<script src="platform.js"></script>
<script src="game.js"></script>
</body>
</html>
